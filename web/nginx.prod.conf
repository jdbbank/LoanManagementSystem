# Production nginx for the web container: static files only.
# /api is deliberately absent — Kong is the single edge in docker-compose.prod.yml, and two
# proxies adding CORS/security headers for the same request is how duplicate headers appear.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite ships one ~670 KB entry chunk plus a ~360 KB manual chunk, and nginx compresses nothing by
    # default. gzip_proxied any is required, not cosmetic: Kong reaches this server as a proxy, and the
    # default `off` would send those files down the wire uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # The gateway forwards the original scheme/host, so absolute redirects stay correct behind it.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
