server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same block as nginx.prod.conf. Without gzip_proxied any, the /api responses below are proxied
    # traffic and nginx would leave their JSON uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location /api/ {
        # `backend` is the in-network name/alias of the API container, so the proxy does not depend
        # on a published host port or on this machine's LAN address.
        # proxy_pass http://backend:4000/api/;
        proxy_pass https://bioservice.jdbbank.com.la:12064/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
