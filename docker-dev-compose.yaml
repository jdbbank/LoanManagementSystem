      - KAFKA_BROKERS=kafka:19092
      - KAFKA_GROUPID=save-log-consumer-group
      - KAFKA_CLIENTID=save-log-kafka-client

      - MYSQL_HOST=mysql
      - MYSQL_USER=mybio
      - MYSQL_PASS=Jdb@2024
      - MYSQL_DB=db_landing_dev
      - MYSQL_PORT=3306
      - SECRET_KEY=Bopby-k8cntt-2022
    networks:
      - dev-landing-network
    depends_on:
      - mysql
      - kafka

  redis-container:
    image: docker.io/redis:7.2.3
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data # Mount a volume for Redis data persistence
    networks:
      - dev-landing-network

  mysql:
    image: mysql:8.2.0
    restart: always
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_landing_dev
      MYSQL_USER: mybio
      MYSQL_PASSWORD: Jdb@2024
      TZ: Asia/Bangkok
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d  # Optional: if you're setting default-time-zone
    ports:
      - "3306:3306"
    networks:
      - dev-landing-network


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - dev-landing-network
    depends_on:
      - mysql



  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    restart: always
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    networks:
      - dev-landing-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    restart: always
    container_name: kafka
    hostname: 'kafka.io'
    ports:
      - "9092:9092"
    networks:
      - dev-landing-network
    depends_on:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka.io
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-172.21.26.83}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 5242880
volumes:
  mysql-data:
  postgres_data:
  # Named lms_mysql_data, not loan_mysql_data: this directory holds both compose files, so the
  # project name is the same and a shared volume name would put two MySQL servers on one datadir.
  lms_mysql_data:
networks:
  dev-landing-network:
   driver: bridge
