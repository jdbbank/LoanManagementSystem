  # --- Loan Management System ---------------------------------------------------------------
  # Reads its secrets from the repo-root .env (same keys as .env.example / docker-compose.yml),
  # so one .env drives both files. lms-* containers talk to each other over dev-landing-network;
  # only the three host ports below are published.
  lms-mysql:
    image: mysql:8.4
    container_name: lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-loan_management}
      MYSQL_USER: ${DB_USER:-loan_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${LMS_MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - lms_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - dev-landing-network

  # One-shot, not part of `up`. It applies server/src/migrations to the lms database and exits,
  # because the schema of record is the migration set, never DB_SYNCHRONIZE:
  #   sudo docker-compose -f ./docker-dev-compose.yaml run --rm lms-db-migrate
  # Run it once after lms-mysql is healthy and again with every release that ships a migration.
  lms-db-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Same image name as lms-backend, so this Dockerfile is built once, not twice.
    image: lms/backend:dev
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: lms-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-loan_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-loan_management}
      DB_SYNCHRONIZE: "false"
    entrypoint: ["npm"]
    command: ["run", "db:migrate", "--workspace", "server"]
    depends_on:
      - lms-mysql
    networks:
      - dev-landing-network

  lms-backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: lms/backend:dev
    container_name: lms-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: lms-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-loan_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-loan_management}
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8098}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      # kafka here is the estate broker below; the port is that container's INTERNAL listener.
      NOTIFY_TRANSPORT: kafka
      NOTIFY_DEFAULT_LOCALE: ${NOTIFY_DEFAULT_LOCALE:-lo}
      NOTIFY_SECRET_KEY: ${NOTIFY_SECRET_KEY:?Set NOTIFY_SECRET_KEY in .env}
      KAFKA_BROKERS: kafka:19092
      MAILER_BASE_URL: http://lms-mailer:4100
      MAILER_API_KEY: ${MAILER_API_KEY:?Set MAILER_API_KEY in .env}
    ports:
      - "${LMS_BACKEND_HOST_PORT:-4001}:4000"
    networks:
      dev-landing-network:
        aliases:
          # lms-frontend's nginx.conf proxies /api to http://backend:4000, so the gateway needs
          # to resolve that name on this network.
          - backend
    depends_on:
      - lms-mysql
      - lms-mailer
      - kafka
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  lms-mailer:
    build:
      context: .
      dockerfile: mailer/Dockerfile
    container_name: lms-mailer
    restart: unless-stopped
    environment:
      MAILER_PORT: 4100
      MAILER_API_KEY: ${MAILER_API_KEY:?Set MAILER_API_KEY in .env}
      KAFKA_CONSUMER_ENABLED: "true"
      KAFKA_BROKERS: kafka:19092
